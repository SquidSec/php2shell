# php2shell lab: Apache prefork, pinned to a single worker.
#
# The chain corrupts state that lives in *one* worker process and is consumed
# by the *next request on that same worker*. With several children, requests
# land on different processes and the chain does not close. A single-worker
# pool makes that deterministic. It is a lab simplification, and it is the
# main reason this PoC is not a drop-in remote exploit for arbitrary servers.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
